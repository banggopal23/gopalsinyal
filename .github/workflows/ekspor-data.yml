name: Ekspor data harga

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ekspor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python export_prices.py
      - name: Simpan
        run: |
          git config user.name "sinyal-bot"
          git config user.email "sinyal-bot@users.noreply.github.com"
          git add -f docs/prices.zip
          git commit -m "Ekspor data harga" || echo "Tidak ada perubahan"
          git push
