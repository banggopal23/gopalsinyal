name: Ekspor data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ekspor:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python export_prices.py
      - name: Simpan hasil
        run: |
          git config user.name "sinyal-bot"
          git config user.email "sinyal-bot@users.noreply.github.com"
          git add docs/prices.zip
          git commit -m "Ekspor data harga $(date -u +%F)" || echo "Tidak ada perubahan"
          git push
