name: Pembaruan harian

on:
  schedule:
    - cron: "40 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py
      - name: Simpan hasil
        run: |
          git config user.name "sinyal-bot"
          git config user.email "sinyal-bot@users.noreply.github.com"
          git add docs/signals.json docs/backtest.json
          git commit -m "Pembaruan data $(date -u +%F)" || echo "Tidak ada perubahan"
          git push
